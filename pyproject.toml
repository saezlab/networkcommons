[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "networkcommons"
version = "0.5.0"
description = "Integrated framework for network inference and evaluation using prior knowledge and omics data"
readme = "README.md"
license = { text = "GPL-3.0-only" }
authors = [
    { name = "Saez Lab", email = "omnipathdb@gmail.com" },
]
requires-python = ">=3.10,<4.0"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Natural Language :: English",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
keywords = [
    "systems biology", "molecular biology", "signaling network",
    "transcriptomics", "modeling", "mechanistic modeling",
    "network inference", "molecular network", "omics", "biomedicine",
]
dependencies = [
    "toml",
    "networkx",
    "pandas",
    "pypath-common>=0.2.5,<0.3.0",
    "pydeseq2>=0.4.9,<0.5.0",
    "requests>=2.32.3,<3.0.0",
    "pooch>=1.8.2,<2.0.0",
    "beautifulsoup4>=4.12.3,<5.0.0",
    "pypath-omnipath>=0.16.16,<0.17.0",
    "numpydoc>=1.7.0,<2.0.0",
    "sphinx-rtd-theme>=2.0.0,<3.0.0",
    "lazy-import>=0.2.2,<0.3.0",
    "anndata<=0.10.8",
    "pytest>=8.2.2,<9.0.0",
    "yfiles-jupyter-graphs>=1.7.2,<2.0.0",
    "pyscipopt>=5.2.1,<6.0.0",
    "scipy>=1.15.1,<2.0.0",
    "matplotlib>=3.5.1,<4.0.0",
    "graphviz>=0.17,<0.18",
    "biomart>=0.9.2,<0.10.0",
    "decoupler>=1.8.0,<2.0.0",
    "omnipath>=1.0.8,<2.0.0",
    "cvxpy-base>=1.6.0,<2.0.0",
    "corneto==1.0.0a0",
    "seaborn>=0.13.2,<0.14.0",
    "numpy>=1.26.4,<2.0.0",
]

[project.optional-dependencies]
igraph = ["igraph>=0.11.6,<0.12.0"]
pygraphviz = ["pygraphviz>=1.11,<2.0"]
corneto-backends = ["pyscipopt>=5.2.1,<6.0.0", "pygraphviz>=1.11,<2.0"]

[project.urls]
Homepage = "https://github.com/saezlab/networkcommons"
Documentation = "https://networkcommons.readthedocs.io/"
Repository = "https://github.com/saezlab/networkcommons"
"Bug Tracker" = "https://github.com/saezlab/networkcommons/issues"

[dependency-groups]
dev = [
    "pytest>=6.0",
    "pytest-timeout>=2.3.1,<3.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "codecov-cli>=0.7.2,<0.8.0",
    "pre-commit>=2.17.0",
    "bump2version",
    "coverage>=6.0",
    "distlib",
    "sphinx>=7.0.0,<8.0.0",
    "sphinx-last-updated-by-git>=0.3",
    "sphinx-autodoc-typehints>=1.18.0",
    "sphinxcontrib-fulltoc>=1.2.0,<2.0.0",
    "sphinxcontrib-bibtex",
    "sphinx-copybutton",
    "myst-parser",
    "myst-nb",
    "jupyterlab",
    "pydata-sphinx-theme",
    "sphinx-remove-toctrees",
    "jupyter-contrib-nbextensions @ git+https://github.com/deeenes/jupyter_contrib_nbextensions.git@master",
    "nbsphinx @ git+https://github.com/deeenes/nbsphinx.git@timings",
]

[tool.hatch.build.targets.wheel]
packages = ["networkcommons"]

[tool.black]
line-length = 80
target-version = ['py31*']
include = '\.pyi?$'
exclude = '''
(
  /(
      \.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.venv
    | _build
    | buck-out
    | build
    | dist
  )/
)
'''

[tool.isort]
from_first = true
line_length = 80
multi_line_output = 3
include_trailing_comma = true
use_parentheses = true
known_num="numpy,pandas"
sections = "FUTURE,STDLIB,THIRDPARTY,NUM,FIRSTPARTY,LOCALFOLDER"
no_lines_before="LOCALFOLDER"
balanced_wrapping = true
force_grid_wrap = 0
length_sort = "1"
indent = "    "
skip = []

[tool.flake8]
extend-select = ["CE101"]
ignore = [
  "D200", "D202", "D401", "D105",
  "W503", "W504",
  "E731", "E131", "E251", "E303"
]
per-file-ignores = [
    "docs/src/conf.py:D100",
    "tests/*:D100,D101,D102",
    "*/__init__.py:F401"
]
max-line-length = 80
count = true
exclude = [
    ".git",
    "__pycache__",
    "build",
    "docs/_build",
    "dist"
]

[tool.yapf]
based_on_style = "facebook"
split_penalty_before_if_expr = 0
split_penalty_import_names = 0
split_penalty_comprehension = 0
split_penalty_for_added_line_split = 0
split_penalty_after_opening_bracket = 0
split_before_first_argument = true
split_before_named_assigns = true
split_complex_comprehension = true

[tool.rstcheck]
report_level = "INFO"
ignore_directives = [
    "automodule",
    "toctree",
]
ignore_roles = ["ref"]
ignore_messages = '(Unknown target name:.*|No (directive|role) entry for "(auto)?(class|method|property|function|func|mod|attr)" in module "docutils\.parsers\.rst\.languages\.en"\.)'

[tool.coverage.paths]
source = [
    "networkcommons",
    "**/site-packages/networkcommons"
]

[tool.coverage.run]
branch = true
parallel = true
source = ["networkcommons"]
omit = [
	"**/test_*.py",
    "**/noi/*",
]

[tool.coverage.report]
show_missing = true
precision = 2
exclude_also = [
    ".*pragma:\\s*no.?cover",
    "if __name__ == .?__main__.?",
    "\\s*raise NotImplementedError",
    "\\s*raise AssertionError",
    "\\s*return NotImplemented",
]

[tool.pytest.ini_options]
testpaths = [
  "tests",
]
xfail_strict = true
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')"
]
addopts = [
    # "-Werror",  # if 3rd party libs raise DeprecationWarnings, just use filterwarnings below
    "--import-mode=importlib",  # allow using test files with same name
    "-m not slow",
]
filterwarnings = [
    "ignore: .*fitting did not converge.*:UserWarning",
    "ignore: .*especially asymmetric.*:UserWarning",
    "ignore: .*machine precision times.*:FutureWarning",
    "ignore: .*invalid escape sequence.*:DeprecationWarning",
]
