[build-system]
build-backend = "uv_build"
requires = [ "uv-build>=0.10.9,<0.11" ]

[project]
name = "networkcommons"
version = "0.5.0"
description = "Integrated framework for network inference and evaluation using prior knowledge and omics data"
readme = "README.md"
keywords = [
  "biomedicine",
  "mechanistic modeling",
  "modeling",
  "molecular biology",
  "molecular network",
  "network inference",
  "omics",
  "signaling network",
  "systems biology",
  "transcriptomics",
]
license = "gpl-3.0-only"
authors = [ { name = "Saez Lab", email = "omnipathdb@gmail.com" } ]
requires-python = ">=3.10,<4.0"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "anndata<=0.10.8",
  "beautifulsoup4>=4.12.3,<5",
  "biomart>=0.9.2,<0.10",
  "corneto==1.0.0a0",
  "cvxpy-base>=1.6,<2",
  "decoupler>=1.8,<2",
  "graphviz>=0.17,<0.18",
  "lazy-import>=0.2.2,<0.3",
  "matplotlib>=3.5.1,<4",
  "networkx",
  "numpy>=1.26.4,<2",
  "numpydoc>=1.7,<2",
  "omnipath>=1.0.8,<2",
  "pandas",
  "pydeseq2>=0.4.9,<0.5",
  "pypath-common>=0.2.5,<0.3",
  "pypath-omnipath>=0.16.16,<0.17",
  "pytest>=8.2.2,<9",
  "requests>=2.32.3,<3",
  "scipy>=1.15.1,<2",
  "seaborn>=0.13.2,<0.14",
  "sphinx-rtd-theme>=2,<3",
  "toml",
  "yfiles-jupyter-graphs>=1.7.2,<2",
]
optional-dependencies.corneto-backends = [
  "pygraphviz>=1.11,<2",
  "pyscipopt>=5.2.1,<6",
]
optional-dependencies.igraph = [ "igraph>=0.11.6,<0.12" ]
optional-dependencies.pygraphviz = [ "pygraphviz>=1.11,<2" ]
optional-dependencies.torch = [ "torch>=2.1" ]
urls."Bug Tracker" = "https://github.com/saezlab/networkcommons/issues"
urls.Documentation = "https://networkcommons.readthedocs.io/"
urls.Homepage = "https://github.com/saezlab/networkcommons"
urls.Repository = "https://github.com/saezlab/networkcommons"

[dependency-groups]
dev = [
  "bump2version",
  "codecov-cli>=0.7.2,<0.8",
  "coverage>=6",
  "distlib",
  "jupyter-contrib-nbextensions",
  "jupyterlab",
  "myst-nb",
  "myst-parser",
  "nbsphinx",
  "pre-commit>=2.17",
  "pydata-sphinx-theme",
  "pytest>=6",
  "pytest-cov>=5,<6",
  "pytest-timeout>=2.3.1,<3",
  "sphinx>=7,<8",
  "sphinx-autodoc-typehints>=1.18",
  "sphinx-copybutton",
  "sphinx-last-updated-by-git>=0.3",
  "sphinx-remove-toctrees",
  "sphinxcontrib-bibtex",
  "sphinxcontrib-fulltoc>=1.2",
  "tox>=3.20.1",
]

[tool.uv]
default-groups = "all"
sources.jupyter-contrib-nbextensions = { git = "https://github.com/deeenes/jupyter_contrib_nbextensions.git", branch = "master" }
sources.nbsphinx = { git = "https://github.com/deeenes/nbsphinx.git", branch = "timings" }
index = [ { name = "pypi-public", url = "https://pypi.org/simple/", default = true } ]
build-backend.module-name = [ "networkcommons" ]
build-backend.module-root = ""

[tool.black]
target-version = [ "py31*" ]
line-length = 80
include = '\.pyi?$'
exclude = '''
(
  /(
      \.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
  )/
)
'''

[tool.yapf]
based_on_style = "facebook"
split_before_first_argument = true
split_before_named_assigns = true
split_complex_comprehension = true
split_penalty_after_opening_bracket = 0
split_penalty_before_if_expr = 0
split_penalty_comprehension = 0
split_penalty_for_added_line_split = 0
split_penalty_import_names = 0

[tool.isort]
line_length = 80
indent = "    "
multi_line_output = 3
balanced_wrapping = true
use_parentheses = true
include_trailing_comma = true
force_grid_wrap = 0
length_sort = "1"
from_first = true
sections = "FUTURE,STDLIB,THIRDPARTY,NUM,FIRSTPARTY,LOCALFOLDER"
no_lines_before = "LOCALFOLDER"
skip = []
known_num = "numpy,pandas"

[tool.flake8]
extend-select = [ "CE101" ]
ignore = [ "D200", "D202", "D401", "D105", "W503", "W504", "E731", "E131", "E251", "E303" ]
per-file-ignores = [ "docs/src/conf.py:D100", "tests/*:D100,D101,D102", "*/__init__.py:F401" ]
max-line-length = 80
count = true
exclude = [ ".git", "__pycache__", "build", "docs/_build", "dist" ]

[tool.pytest]
ini_options.testpaths = [
  "tests",
]
ini_options.addopts = [
  # "-Werror",  # if 3rd party libs raise DeprecationWarnings, just use filterwarnings below
  "--import-mode=importlib", # allow using test files with same name
  "-m not slow",
]
ini_options.markers = [ "slow: marks tests as slow (deselect with '-m \"not slow\"')" ]
ini_options.xfail_strict = true
ini_options.filterwarnings = [
  "ignore: .*especially asymmetric.*:UserWarning",
  "ignore: .*fitting did not converge.*:UserWarning",
  "ignore: .*invalid escape sequence.*:DeprecationWarning",
  "ignore: .*machine precision times.*:FutureWarning",
]

[tool.coverage]
run.branch = true
run.omit = [
  "**/noi/*",
  "**/test_*.py",
]
run.parallel = true
run.source = [ "networkcommons" ]
paths.source = [ "networkcommons", "**/site-packages/networkcommons" ]
report.exclude_also = [
  ".*pragma:\\s*no.?cover",
  "\\s*raise AssertionError",
  "\\s*raise NotImplementedError",
  "\\s*return NotImplemented",
  "if __name__ == .?__main__.?",
]
report.precision = 2
report.show_missing = true

[tool.rstcheck]
report_level = "INFO"
ignore_directives = [
  "automodule",
  "toctree",
]
ignore_roles = [ "ref" ]
ignore_messages = """\
  (Unknown target name:.*|No (directive|role) entry for \"(auto)?(class|method|property|function|func|mod|attr)\" in \
  module \"docutils\\.parsers\\.rst\\.languages\\.en\"\\.)\
  """
