[build-system]
build-backend = "uv_build"
requires = [ "uv-build>=0.10.9,<0.11" ]

[project]
name = "networkcommons"
version = "0.5.0"
description = "Integrated framework for network inference and evaluation using prior knowledge and omics data"
readme = "README.md"
keywords = [
  "biomedicine",
  "mechanistic modeling",
  "modeling",
  "molecular biology",
  "molecular network",
  "network inference",
  "omics",
  "signaling network",
  "systems biology",
  "transcriptomics",
]
license = "gpl-3.0-only"
authors = [ { name = "Saez Lab", email = "omnipathdb@gmail.com" } ]
requires-python = ">=3.10,<4.0"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "anndata<=0.10.8",
  "beautifulsoup4>=4.12.3,<5",
  "biomart>=0.9.2,<0.10",
  "corneto==1.0.0a0",
  "cvxpy-base>=1.6,<2",
  "decoupler>=1.8,<2",
  "graphviz>=0.17,<0.18",
  "lazy-import>=0.2.2,<0.3",
  "matplotlib>=3.5.1,<4",
  "networkx",
  "numpy>=1.26.4,<2",
  "omnipath>=1.0.8,<2",
  "pandas",
  "pydeseq2>=0.4.9,<0.5",
  "pypath-common>=0.2.5,<0.3",
  "pypath-omnipath>=0.16.16,<0.17",
  "requests>=2.32.3,<3",
  "scipy>=1.15.1,<2",
  "seaborn>=0.13.2,<0.14",
  "toml",
  "yfiles-jupyter-graphs>=1.7.2,<2",
]
optional-dependencies.corneto-backends = [
  "pygraphviz>=1.11,<2",
  "pyscipopt>=5.2.1,<6",
]
optional-dependencies.igraph = [ "igraph>=0.11.6,<0.12" ]
optional-dependencies.pygraphviz = [ "pygraphviz>=1.11,<2" ]
optional-dependencies.torch = [ "torch>=2.1" ]
urls."Bug Tracker" = "https://github.com/saezlab/networkcommons/issues"
urls.Documentation = "https://networkcommons.readthedocs.io/"
urls.Homepage = "https://github.com/saezlab/networkcommons"
urls.Repository = "https://github.com/saezlab/networkcommons"

[dependency-groups]
dev = [
  "bump2version",
  "distlib",
  { include-group = "docs" },
  { include-group = "lint" },
  { include-group = "test" },
]
test = [
  "codecov-cli>=0.7.2,<0.8",
  "coverage>=6",
  "pytest>=6",
  "pytest-cov>=5,<6",
  "pytest-timeout>=2.3.1,<3",
  "tox>=3.20.1",
]
docs = [
  "jupyter-contrib-nbextensions",
  "jupyterlab",
  "myst-nb",
  "myst-parser",
  "nbsphinx",
  "numpydoc>=1.7,<2",
  "pydata-sphinx-theme",
  "sphinx>=7,<8",
  "sphinx-autodoc-typehints>=1.18",
  "sphinx-copybutton",
  "sphinx-last-updated-by-git>=0.3",
  "sphinx-remove-toctrees",
  "sphinx-rtd-theme>=2,<3",
  "sphinxcontrib-bibtex",
  "sphinxcontrib-fulltoc>=1.2",
]
lint = [
  "pre-commit>=2.17",
]

[tool.uv]
default-groups = "all"
sources.jupyter-contrib-nbextensions = { git = "https://github.com/deeenes/jupyter_contrib_nbextensions.git", branch = "master" }
sources.nbsphinx = { git = "https://github.com/deeenes/nbsphinx.git", branch = "timings" }
index = [ { name = "pypi-public", url = "https://pypi.org/simple/", default = true } ]
build-backend.module-name = [ "networkcommons" ]
build-backend.module-root = ""

[tool.ruff]
target-version = "py310"
line-length = 80
extend-include = [ "*.ipynb" ]
format.quote-style = "single"
format.docstring-code-format = true
lint.select = [
  "B",   # flake8-bugbear
  "BLE", # flake8-blind-except
  "C4",  # flake8-comprehensions
  "COM", # flake8-commas
  "D",   # pydocstyle
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "PGH", # pygrep-hooks
  "PTH", # flake8-use-pathlib
  "RUF", # ruff-specific
  "SIM", # flake8-simplify
  "UP",  # pyupgrade
  "W",   # pycodestyle warnings
]
lint.ignore = [
  "D203", # one blank line before class docstring (incompatible with D211)
  "D213", # multi-line summary second line (incompatible with D212)
  "D401", # first line imperative mood
  "E501", # line too long — formatter enforces line-length
  "E731", # lambda assignment
]
lint.per-file-ignores."*/__init__.py" = [ "F401" ]
lint.per-file-ignores."docs/src/conf.py" = [ "D100" ]
lint.per-file-ignores."tests/*" = [ "D" ]
lint.isort.known-third-party = [ "numpy", "pandas" ]
lint.pydocstyle.convention = "numpy"

[tool.pytest]
ini_options.testpaths = [
  "tests",
]
ini_options.addopts = [
  # "-Werror",  # if 3rd party libs raise DeprecationWarnings, just use filterwarnings below
  "--import-mode=importlib", # allow using test files with same name
  "-m not slow",
]
ini_options.markers = [ "slow: marks tests as slow (deselect with '-m \"not slow\"')" ]
ini_options.xfail_strict = true
ini_options.filterwarnings = [
  "ignore: .*especially asymmetric.*:UserWarning",
  "ignore: .*fitting did not converge.*:UserWarning",
  "ignore: .*invalid escape sequence.*:DeprecationWarning",
  "ignore: .*machine precision times.*:FutureWarning",
]

[tool.coverage]
run.branch = true
run.omit = [
  "**/noi/*",
  "**/test_*.py",
]
run.parallel = true
run.source = [ "networkcommons" ]
paths.source = [ "networkcommons", "**/site-packages/networkcommons" ]
report.exclude_also = [
  ".*pragma:\\s*no.?cover",
  "\\s*raise AssertionError",
  "\\s*raise NotImplementedError",
  "\\s*return NotImplemented",
  "if __name__ == .?__main__.?",
]
report.precision = 2
report.show_missing = true

[tool.rstcheck]
report_level = "INFO"
ignore_directives = [
  "automodule",
  "toctree",
]
ignore_roles = [ "ref" ]
ignore_messages = """\
  (Unknown target name:.*|No (directive|role) entry for \"(auto)?(class|method|property|function|func|mod|attr)\" in \
  module \"docutils\\.parsers\\.rst\\.languages\\.en\"\\.)\
  """
