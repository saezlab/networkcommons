name: Unit tests (fast suite)

on:
    push:
        branches: [main, dev]
    pull_request:
        branches: [main, dev]
        types: [ opened, synchronize, reopened, ready_for_review ]

jobs:

    tests:

        runs-on: ${{ matrix.os }}

        defaults:
            run:
                shell: bash -e {0}

        strategy:
            fail-fast: false
            matrix:
                python: ['3.10', '3.11', '3.12']
                os: [ubuntu-latest, macos-latest]

        env:
            OS: ${{ matrix.os }}
            PYTHON: ${{ matrix.python }}

        steps:
        -   name: Check out
            uses: actions/checkout@main
        -   name: Install graphviz headers
            if: ${{ matrix.os == 'ubuntu-latest' }}
            run: |
              sudo apt-get update
              sudo apt-get install -y graphviz graphviz-dev
        -   name: Install graphviz headers
            if: ${{ matrix.os == 'macos-latest' }}
            run: |
              brew install graphviz
              echo "PATH=\"$(brew --prefix graphviz)/bin:$PATH\"" >> "$GITHUB_ENV"
              echo "CFLAGS=\"-I$(brew --prefix graphviz)/include\"" >> "$GITHUB_ENV"
              echo "LDFLAGS=\"-L$(brew --prefix graphviz)/lib\"" >> "$GITHUB_ENV"
        -   name: Install uv
            uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
            with:
                enable-cache: true
                python-version: ${{ matrix.python }}
        -   name: Install dependencies
            run: uv sync --locked --group test --extra corneto-backends
        -   name: Tests and coverage
            if: ${{ github.event_name == 'push' }}
            run: uv run pytest -v --cov --color=yes --durations=0
        -   name: Tests
            if: ${{ github.event_name == 'pull_request' }}
            run: uv run pytest -v --cov --color=yes --durations=0
        -   name: Upload coverage reports to Codecov
            if: ${{ github.event_name == 'push' }}
            env:
                CODECOV_NAME: ${{ matrix.python }}-${{ matrix.os }}
            run: |
                uv run codecovcli --verbose upload-process -t ${{ secrets.CODECOV_TOKEN }} -n 'fast'-${{ github.run_id }} -F fast
