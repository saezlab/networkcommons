name: Package build

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    package:
        runs-on: ubuntu-latest
        steps:
        -   uses: actions/checkout@v2
        -   name: Set up Python 3.10
            uses: actions/setup-python@v2
            with:
                python-version: '3.10'
        -   name: Install uv
            uses: astral-sh/setup-uv@v6
            with:
                enable-cache: true
                cache-dependency-glob: uv.lock
        -   name: Build package
            run: uv build
        -   name: Check package
            run: uvx --from twine twine check --strict dist/*.whl
